<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Type 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&family=IBM+Plex+Mono:wght@500&family=Inter+Tight:wght@300;400;500&family=Space+Grotesk:wght@400;500&family=Space+Mono&family=Instrument+Sans:wght@400;500&family=IBM+Plex+Sans+KR:wght@400&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--paper:#EEF4EF;--ink:#0F1A16;--stone:#4F6F64;--line:#D5E3DA;--accent:#1F4A3D}
*{box-sizing:border-box;margin:0;padding:0}body{background:#fff;color:var(--ink);font-family:Pretendard Variable,sans-serif}
.opt{display:grid;grid-template-columns:300px 1fr;gap:28px;padding:44px 32px;border-bottom:1px solid #e6e6e6}
.meta .k{display:inline-block;background:var(--ink);color:#fff;font:500 11px 'JetBrains Mono';letter-spacing:.08em;padding:5px 9px;border-radius:5px}
.meta h3{font:600 26px Pretendard Variable;margin:12px 0 6px}.meta p{font-size:13.5px;line-height:1.7;color:#555}
.meta ul{list-style:none;margin:14px 0;font-size:12.5px;line-height:1.9;color:#333}.meta ul b{display:inline-block;width:62px;color:#888;font-weight:500}
.meta img{width:100%;border-radius:8px;border:1px solid #eee;margin-top:10px}.meta .src{font:500 10px 'JetBrains Mono';color:#888;margin-top:6px;display:block}
.demo{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.hero{position:relative;border-radius:12px;overflow:hidden;min-height:400px;background:url(../img/work/hero.jpg) center/cover}
.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.15) 50%,rgba(0,0,0,.4))}
.hero h1{position:absolute;left:0;right:0;top:44px;text-align:center;color:#fff}
.hero .sub{position:absolute;left:20px;bottom:22px;color:#eee;font-size:13px;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:12px;background:#fff;color:var(--ink);padding:5px 5px 5px 14px;border-radius:7px}
.btn i{font-style:normal;background:var(--ink);color:#fff;width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px}
.hero .btn{position:absolute;left:50%;bottom:22px;transform:translateX(-50%)}
.panel{background:var(--paper);border-radius:12px;padding:30px 26px;display:flex;flex-direction:column;gap:18px}
.panel h2{line-height:.98}.panel p{font-size:14.5px;line-height:1.75;color:var(--stone)}
.row{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:9px 0;font-size:12px}
.lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
/* A Seasats */
.A h1,.A h2{font-family:Newsreader,serif;font-weight:300;letter-spacing:-.025em}.A h1{font-size:64px;line-height:.98}.A h2{font-size:46px}
.A .lbl,.A .btn,.A .row{font-family:'IBM Plex Mono',monospace}.A p,.A .sub{font-family:Pretendard Variable}
/* B Aesop */
.B h1,.B h2{font-family:'Inter Tight',sans-serif;font-weight:300;letter-spacing:-.035em}.B h1{font-size:60px;line-height:1}.B h2{font-size:44px}
.B .lbl,.B .btn,.B .row{font-family:'IBM Plex Mono',monospace}
/* C TE */
.C h1,.C h2{font-family:'Space Grotesk',sans-serif;font-weight:500;letter-spacing:-.03em;text-transform:lowercase}.C h1{font-size:58px;line-height:.98}.C h2{font-size:42px}
.C .lbl,.C .btn,.C .row{font-family:'Space Mono',monospace}
/* D current */
.D h1,.D h2{font-family:'Instrument Sans',sans-serif;font-weight:400;letter-spacing:-.05em}.D h1{font-size:62px;line-height:.98}.D h2{font-size:44px}
.D .lbl,.D .btn,.D .row{font-family:'JetBrains Mono',monospace}.D p,.D .sub{font-family:'IBM Plex Sans KR'}
@media(max-width:900px){.opt,.demo{grid-template-columns:1fr}}
</style></head><body>
<!--OPTS-->
</body></html>
